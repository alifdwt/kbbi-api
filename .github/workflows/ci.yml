name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"
      - name: Run gofmt check
        run: |
          set -e
          if [ -n "$(gofmt -l .)" ]; then echo "gofmt needs formatting:"; gofmt -l .; exit 1; fi
      - name: Run tests
        run: go test ./...
